<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <!-- FIX: Added iOS 10+ fail-safe rule that prevents form jumping but keeps pinch-zoom active -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"> 
  <title>Team Registration Form</title> 
  <!-- Links to your clean stylesheet --> 
  <link rel="stylesheet" href="style.css"> 
</head> 
<body> 
  <form id="teamForm" autocomplete="on"> 
    <h2>Team Registration</h2> 
    
    <!-- FIX: Added clear name and autocomplete values to satisfy Safari's auto-fill engine -->
    <div class="field"> 
      <label for="teamName">Team Name</label> 
      <input type="text" id="teamName" name="teamName" autocomplete="organization" required> 
    </div> 
    <div class="field"> 
      <label for="contactName">Contact Name</label> 
      <input type="text" id="contactName" name="contactName" autocomplete="name" required> 
    </div> 
    <div class="field"> 
      <label for="phone">Phone Number</label> 
      <input type="tel" id="phone" name="phone" autocomplete="tel" required> 
    </div> 
    <div class="field"> 
      <label for="email">Email Address</label> 
      <input type="email" id="email" name="email" autocomplete="email" required> 
    </div> 
    <div class="field"> 
      <label for="textColor">Text Color Choice</label> 
      <select id="textColor" name="textColor" required> 
        <option value="">-- Select a Color --</option> 
        <option value="White">White</option> 
        <option value="Black">Black</option> 
        <option value="Red">Red</option> 
        <option value="Blue">Blue</option> 
        <option value="Royal Blue">Royal Blue</option> 
        <option value="Navy Blue">Navy Blue</option> 
        <option value="Gold">Gold</option> 
        <option value="Brown">Brown</option> 
        <option value="Forest Green">Forest Green</option> 
      </select> 
    </div> 

    <div class="roster-section"> 
      <label style="display: block; font-size: 18px; margin-bottom: 10px; font-weight: bold;">Player Roster</label> 
      <div id="playerContainer"> 
        <div class="player-row" data-id="1"> 
          <div class="row-inputs"> 
            <input type="number" placeholder="Jersey #" class="jersey" min="0" max="99" required> 
            <input type="text" placeholder="First Name" class="firstName" required> 
            <input type="text" placeholder="Last Name" class="lastName" required> 
            <input type="text" placeholder="Nickname (Optional)" class="nickname"> 
          </div> 
          <div class="print-options"> 
            <span>Print on Jersey:</span> 
            <label><input type="radio" name="printTarget_1" value="first"> First Name</label> 
            <label><input type="radio" name="printTarget_1" value="last" checked> Last Name</label> 
            <label><input type="radio" name="printTarget_1" value="nick"> Nickname</label> 
          </div> 
          <button type="button" class="remove-btn">✕ Remove</button> 
        </div> 
      </div> 
      <button type="button" class="add-btn" id="addPlayerBtn">+ Add Player</button> 
    </div> 

    <div class="btn-container"> 
      <button type="submit" class="submit-btn">Review Registration</button> 
    </div> 
  </form> 

  <!-- Preview Modal Window Overlay --> 
  <div id="previewModal" class="modal"> 
    <div class="modal-content"> 
      <h3>Verify Your Details</h3> 
      <p>Please check your entry carefully before final submission.</p> 
      <div class="preview-group"><div class="preview-label">Team Name:</div><div id="pTeamName" class="preview-value"></div></div> 
      <div class="preview-group"><div class="preview-label">Contact Name:</div><div id="pContactName" class="preview-value"></div></div> 
      <div class="preview-group"><div class="preview-label">Phone:</div><div id="pPhone" class="preview-value"></div></div> 
      <div class="preview-group"><div class="preview-label">Email:</div><div id="pEmail" class="preview-value"></div></div> 
      <div class="preview-group"><div class="preview-label">Text Color:</div><div id="pTextColor" class="preview-value"></div></div> 
      
      <div class="preview-label" style="margin-top:15px;">Player Roster Summary:</div> 
      <table class="preview-roster-table"> 
        <thead> 
          <tr><th>Jersey</th><th>Full Name</th><th>Nickname</th><th>Name on Jersey</th></tr> 
        </thead> 
        <tbody id="p_rosterBody"></tbody> 
      </table> 
      
      <div class="modal-buttons"> 
        <button type="button" class="edit-btn" id="closeModalBtn">← Edit Details</button> 
        <button type="button" class="confirm-btn" id="finalSubmitBtn">Confirm & Submit</button> 
      </div> 
    </div> 
  </div> 

  <!-- Links to your clean automation script --> 
  <script src="script.js"></script> 
</body> 
</html>
